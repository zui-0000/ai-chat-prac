version: 2
updates:
  # ワークフローの Action の版を上げる PR を作る。npm の依存は vp で上げるので対象にしない
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # pnpm の minimumReleaseAge と同じく、公開から 1 日たった版だけを使う
    cooldown:
      default-days: 1
    # コミットメッセージを Conventional Commits にそろえる（chore(deps): ...）
    commit-message:
      prefix: chore
      include: scope
