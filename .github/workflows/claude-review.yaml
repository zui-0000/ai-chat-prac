name: Claude Review

# claude-review のラベルを貼ったときだけ動く。見てほしい PR だけ、Max の利用枠を使ってレビューを受ける。
# pull_request_target は使わない。秘密の値を持ったまま、フォークの PR のコードを扱うことになるため
on:
  pull_request:
    types: [labeled]

# ワークフロー全体の既定は権限なし。必要な分はジョブで渡す
permissions: {}

# 同じ PR でラベルを貼り直したら、古いレビューを取り消す
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    # フォークの PR には GitHub が秘密の値を渡さず、動いても失敗するだけなので、同じリポジトリのブランチの PR だけで動かす
    if: >-
      github.event.label.name == 'claude-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # コメントを書くのに pull-requests: write が要る。コードは読むだけ
    permissions:
      contents: read
      pull-requests: write
    steps:
      # CLAUDE.md を読んで決まりに沿っているかを見るので、リポジトリのファイルを置く
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # 公式の code-review プラグインでレビューする。--comment で、指摘を行ごとのコメントにして PR に付ける
      - uses: anthropics/claude-code-action@v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub App を入れず、このジョブの権限だけを持つトークンで書く。ジョブが終わると切れる
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # 行ごとのコメントを書く道具は、ここで名前を挙げたときだけ用意される。
          # ほかに使えるのは、プラグインが決めた gh の読み取りとコメントだけ。コードを動かす道具は渡さない
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment"
