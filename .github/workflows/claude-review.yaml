name: Claude Review

# pull_request_target は使わない。秘密の値を持ったまま、フォークの PR のコードを扱うことになるため
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  review:
    name: review
    # フォークの PR には秘密の値が渡らないので、同じリポジトリのブランチの PR だけで動かす。
    # レビューの手順は PR の状態と向き先を見ず、既定のブランチとの差分を取るので、
    # 既定のブランチに向いた、開いていて下書きでない PR だけにする
    if: >-
      github.event.label.name == 'claude-review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ワークフローに書くと、関係ないラベルを貼っただけで動いているレビューが取り消される
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Claude に渡すトークンは読むだけ。PR に書くのは App のトークンで、Claude には渡さない
    permissions:
      contents: read
      pull-requests: read
    outputs:
      claude: ${{ steps.claude.outcome }}
      result: ${{ steps.result.outputs.result }}
      marker: ${{ steps.marker.outputs.id }}
    steps:
      # 指摘の行番号を PR の差分と合わせるため、マージ後の形ではなく PR の最新のコミットを置く。
      # レビューの手順は、既定のブランチとの分かれ目から差分を取るので、履歴を全部取ってくる
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # レビューの手順は、既定のブランチを手元のブランチの名前で引く
      - name: 既定のブランチを手元に作る
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: git branch "$DEFAULT" "origin/$DEFAULT"

      # レビューの手順は非公開のリポジトリにある。そのリポジトリだけを、読むだけで取ってくる
      - id: skills-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          repositories: ${{ secrets.SKILLS_REPO }}
          permission-contents: read

      # 作業フォルダの中に置くと、まだ追跡していないファイルとしてレビューの差分に混ざるので、外に置く。
      # 取ってきたら、このトークンはすぐ取り消す（後始末でも取り消す）
      - name: レビューの手順を取ってくる
        env:
          GH_TOKEN: ${{ steps.skills-token.outputs.token }}
          SKILLS: ${{ github.repository_owner }}/${{ secrets.SKILLS_REPO }}
        run: |
          trap 'gh api -X DELETE installation/token --silent' EXIT
          gh repo clone "$SKILLS" "$RUNNER_TEMP/skills" -- --depth 1 --quiet

      # App はレビューを頼む相手にできないので、レビュー中であることをコメントで見せる。付けられなくてもレビューは続ける
      - id: marker-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      # 印を付けたら、このトークンはすぐ取り消す。Claude が動いているあいだ、書き込めるトークンを残さない。
      # 後始末でも取り消すので、印を付ける前にジョブが止まってもトークンは残らない（取り消し済みなら警告だけ出る）
      - id: marker
        name: レビュー中の印を付ける
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.marker-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          trap 'gh api -X DELETE installation/token --silent' EXIT
          id=$(gh api "repos/$REPO/issues/$PR/comments" -f body="レビューするわ！まかせなさい！" --jq .id)
          echo "id=$id" >>"$GITHUB_OUTPUT"

      # 非公開のリポジトリの名前はログに出さないので、秘密の値から渡す（ログでは伏せられる）
      - id: claude
        uses: anthropics/claude-code-action@v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: ${{ runner.temp }}/skills
          plugins: |
            review@${{ secrets.SKILLS_MARKETPLACE }}
            ai-chat-prac@${{ secrets.SKILLS_MARKETPLACE }}
          # 指摘は構造化出力で受け取る。ファイルを書く道具は禁じる
          prompt: /review:code medium
          claude_args: |
            --model opus
            --append-system-prompt-file .github/claude-review/persona.md
            --disallowedTools "Bash(gh pr comment:*)" Edit Write NotebookEdit
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["reviewed","skipped"]},"skip_reason":{"type":"string"},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"start_line":{"type":"integer"},"body":{"type":"string"}},"required":["path","line","body"]}}},"required":["status","summary","findings"]}'

      # 秘密の値を含む outputs は GitHub が落とすので、名前を伏せてから渡す
      - id: result
        name: レビューの結果を渡す
        if: ${{ steps.claude.outcome == 'success' }}
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
          HIDE_REPO: ${{ secrets.SKILLS_REPO }}
          HIDE_MARKETPLACE: ${{ secrets.SKILLS_MARKETPLACE }}
        run: |
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "result<<$delimiter"
            jq -c -L .github/claude-review --arg repo "$HIDE_REPO" --arg marketplace "$HIDE_MARKETPLACE" \
              'include "hide-names"; hide_review([$repo, $marketplace])' <<<"$RESULT"
            echo "$delimiter"
          } >>"$GITHUB_OUTPUT"

  # Claude は Bash を使えるので、同じランナーのファイルや道具を書き換えられる。
  # 書き込める App のトークンは、Claude が動いたランナーでは使わず、新しいランナーのこのジョブで使う
  review-post:
    name: review-post
    needs: review
    # 失敗・取り消しのときも、印を消すために動かす
    if: ${{ always() && needs.review.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # レビューしたコミットのスクリプトを動かす
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/claude-review

      - id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: レビューを PR に出す
        if: ${{ needs.review.outputs.claude == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.review.outputs.result }}
          HIDE_REPO: ${{ secrets.SKILLS_REPO }}
          HIDE_MARKETPLACE: ${{ secrets.SKILLS_MARKETPLACE }}
        run: bash .github/claude-review/post-review.sh

      # 失敗・取り消しのときも消す
      - name: レビュー中の印を消す
        if: ${{ always() && needs.review.outputs.marker != '' && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.review.outputs.marker }}
        run: gh api -X DELETE "repos/$REPO/issues/comments/$ID" --silent || echo "::warning::印を消せなかった"

  re-review:
    name: re-review
    if: >-
      github.event.label.name == 'claude-re-review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      # 再確認でも、レビューと同じ決まりで見るため、決まりを置いた非公開のリポジトリを読むだけで取ってくる
      - id: skills-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          repositories: ${{ secrets.SKILLS_REPO }}
          permission-contents: read

      - name: 決まりを取ってくる
        env:
          GH_TOKEN: ${{ steps.skills-token.outputs.token }}
          SKILLS: ${{ github.repository_owner }}/${{ secrets.SKILLS_REPO }}
        run: |
          trap 'gh api -X DELETE installation/token --silent' EXIT
          gh repo clone "$SKILLS" "$RUNNER_TEMP/skills" -- --depth 1 --quiet

      # slug（App の名前）は、このトークンの出力を使って、App の指摘を見分けるのにも使う
      - id: marker-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      # 印を付けたら、このトークンはすぐ取り消す。Claude が動いているあいだ、書き込めるトークンを残さない。
      # 後始末でも取り消すので、印を付ける前にジョブが止まってもトークンは残らない（取り消し済みなら警告だけ出る）
      - id: marker
        name: レビュー中の印を付ける
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.marker-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          trap 'gh api -X DELETE installation/token --silent' EXIT
          id=$(gh api "repos/$REPO/issues/$PR/comments" -f body="再レビューね！まかせなさい！" --jq .id)
          echo "id=$id" >>"$GITHUB_OUTPUT"

      - id: threads
        name: まだ解決していない指摘を集める
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BOT: ${{ steps.marker-token.outputs.app-slug }}
          OUT: claude-re-review-threads.json
        run: bash .github/claude-review/collect-threads.sh

      - id: claude
        if: ${{ steps.threads.outputs.count != '0' }}
        uses: anthropics/claude-code-action@v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # レビューの手順は使わないので、決まりだけを入れる
          plugin_marketplaces: ${{ runner.temp }}/skills
          plugins: |
            ai-chat-prac@${{ secrets.SKILLS_MARKETPLACE }}
          prompt: |
            前のレビューの指摘が直っているかを、指摘ごとに確かめなさい。

            - 確かめる指摘は `claude-re-review-threads.json` にある。どれも、まだ解決していないレビューのスレッド（id・path・line・最初のコメントの body・返事の replies）
            - 作業フォルダは、PR の最新のコミット。PR の差分は `gh pr diff ${{ github.event.pull_request.number }}` で見られる
            - ファイルは書き換えない
            - `threads` には、ファイルのスレッドを 1 つずつ全部入れる。`id` はファイルの値をそのまま使う
          claude_args: |
            --model opus
            --append-system-prompt-file .github/claude-review/persona.md
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*)"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"threads":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"fixed":{"type":"boolean"},"comment":{"type":"string"}},"required":["id","fixed","comment"]}}},"required":["summary","threads"]}'

      # 書き込むトークンは Claude が終わってから作る
      - id: app-token
        if: ${{ always() }}
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      # スレッドの解決（resolveReviewThread）は Contents の書き込みを求めるので、結果を出すステップだけ別のトークンにする
      - id: resolver-token
        if: ${{ steps.claude.outcome == 'success' || steps.claude.outcome == 'skipped' }}
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: post
        name: 再確認の結果を PR に出す
        if: ${{ steps.claude.outcome == 'success' || steps.claude.outcome == 'skipped' }}
        env:
          GH_TOKEN: ${{ steps.resolver-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWED: ${{ steps.threads.outputs.reviewed }}
          THREADS: claude-re-review-threads.json
          RESULT: ${{ steps.claude.outputs.structured_output }}
          HIDE_REPO: ${{ secrets.SKILLS_REPO }}
          HIDE_MARKETPLACE: ${{ secrets.SKILLS_MARKETPLACE }}
        run: bash .github/claude-review/post-re-review.sh

      # 承認しなかったときだけ外し、直したあとにもう一度貼れるようにする
      - name: ラベルを外す
        if: ${{ always() && steps.app-token.outcome == 'success' && steps.post.outputs.approved != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/claude-re-review" --silent || echo "::warning::ラベルを外せなかった"

      - name: レビュー中の印を消す
        if: ${{ always() && steps.marker.outputs.id != '' && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.marker.outputs.id }}
        run: gh api -X DELETE "repos/$REPO/issues/comments/$ID" --silent || echo "::warning::印を消せなかった"
