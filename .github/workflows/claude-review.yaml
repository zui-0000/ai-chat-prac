name: Claude Review

# pull_request_target は使わない。秘密の値を持ったまま、フォークの PR のコードを扱うことになるため
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  review:
    name: review
    # フォークの PR には秘密の値が渡らないので、同じリポジトリのブランチの PR だけで動かす
    if: >-
      github.event.label.name == 'claude-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ワークフローに書くと、関係ないラベルを貼っただけで動いているレビューが取り消される
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Claude に渡すトークンは読むだけ。PR に書くのは App のトークンで、Claude には渡さない
    permissions:
      contents: read
      pull-requests: read
    steps:
      # 指摘の行番号を PR の差分と合わせるため、マージ後の形ではなく PR の最新のコミットを置く
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      # App はレビューを頼む相手にできないので、レビュー中であることをコメントで見せる。付けられなくてもレビューは続ける
      - id: marker
        name: レビュー中の印を付ける
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" -f body="レビューするわ。まかせて！" --jq .id)
          echo "id=$id" >>"$GITHUB_OUTPUT"

      - id: claude
        uses: anthropics/claude-code-action@v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          # --comment を付けず、指摘は構造化出力で受け取る。プラグインが許している gh pr comment は禁じる
          prompt: /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: |
            --append-system-prompt-file .github/claude-review/persona.md
            --disallowedTools "Bash(gh pr comment:*)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["reviewed","skipped"]},"skip_reason":{"type":"string"},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"start_line":{"type":"integer"},"body":{"type":"string"}},"required":["path","line","body"]}}},"required":["status","summary","findings"]}'

      - name: レビューを PR に出す
        if: ${{ steps.claude.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: bash .github/claude-review/post-review.sh

      # 外しておくと、もう一度貼るだけでまた動かせる
      - name: ラベルを外す
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/claude-review" --silent || echo "::warning::ラベルを外せなかった"

      # 失敗・取り消しのときも消す
      - name: レビュー中の印を消す
        if: ${{ always() && steps.marker.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.marker.outputs.id }}
        run: gh api -X DELETE "repos/$REPO/issues/comments/$ID" --silent || echo "::warning::印を消せなかった"

  re-review:
    name: re-review
    if: >-
      github.event.label.name == 'claude-re-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      # slug で App の指摘を見分ける
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - id: marker
        name: レビュー中の印を付ける
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" -f body="再レビューね！まかせて！" --jq .id)
          echo "id=$id" >>"$GITHUB_OUTPUT"

      - id: threads
        name: まだ解決していない指摘を集める
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BOT: ${{ steps.app-token.outputs.app-slug }}
          OUT: claude-re-review-threads.json
        run: bash .github/claude-review/collect-threads.sh

      - id: claude
        if: ${{ steps.threads.outputs.count != '0' }}
        uses: anthropics/claude-code-action@v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            前のレビューの指摘が直っているかを、指摘ごとに確かめなさい。

            - 確かめる指摘は `claude-re-review-threads.json` にある。どれも、まだ解決していないレビューのスレッド（id・path・line・最初のコメントの body・返事の replies）
            - 作業フォルダは、PR の最新のコミット。PR の差分は `gh pr diff ${{ github.event.pull_request.number }}` で見られる
            - ファイルは書き換えない
            - `threads` には、ファイルのスレッドを 1 つずつ全部入れる。`id` はファイルの値をそのまま使う
          claude_args: |
            --append-system-prompt-file .github/claude-review/persona.md
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*)"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"threads":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"fixed":{"type":"boolean"},"comment":{"type":"string"}},"required":["id","fixed","comment"]}}},"required":["summary","threads"]}'

      # スレッドの解決（resolveReviewThread）は Contents の書き込みを求める。このトークンは Claude が終わってから作る
      - id: resolver-token
        if: ${{ steps.claude.outcome == 'success' || steps.claude.outcome == 'skipped' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 再確認の結果を PR に出す
        if: ${{ steps.claude.outcome == 'success' || steps.claude.outcome == 'skipped' }}
        env:
          GH_TOKEN: ${{ steps.resolver-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWED: ${{ steps.threads.outputs.reviewed }}
          THREADS: claude-re-review-threads.json
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: bash .github/claude-review/post-re-review.sh

      - name: ラベルを外す
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/claude-re-review" --silent || echo "::warning::ラベルを外せなかった"

      - name: レビュー中の印を消す
        if: ${{ always() && steps.marker.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.marker.outputs.id }}
        run: gh api -X DELETE "repos/$REPO/issues/comments/$ID" --silent || echo "::warning::印を消せなかった"
